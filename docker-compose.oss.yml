# Local open-source dependencies for OrderCheck.
# Demo only. The passwords below are local placeholders, not production secrets.
# Usage: docker compose -f docker-compose.oss.yml up -d
#
# Then point .env.local at:
#   SMTP_HOST=127.0.0.1
#   SMTP_PORT=1025
#   SMTP_FROM=seller@localhost
#   S3_ENDPOINT=http://127.0.0.1:9000
#   S3_ACCESS_KEY=ordercheck
#   S3_SECRET_KEY=ordercheck-local-only
#   S3_BUCKET=ordercheck-mail
#   S3_FORCE_PATH_STYLE=true
#   DATABASE_URL=postgres://ordercheck:ordercheck-local-only@127.0.0.1:5432/ordercheck
# Create the MinIO bucket once (console http://127.0.0.1:9001, or `mc mb`).
# Mailpit UI: http://127.0.0.1:8025
# Ollama stays on the host (or your own container); it is not started here.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ordercheck
      MINIO_ROOT_PASSWORD: ordercheck-local-only
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ordercheck
      POSTGRES_PASSWORD: ordercheck-local-only
      POSTGRES_DB: ordercheck
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  minio-data:
  pg-data:
